# KataGo settings for Surround's local play page (see katago/bridge.ts).
# Surround scores by area with positional superko and no suicide. Players
# agree on dead stones after two passes, so KataGo may pass without first
# capturing every dead stone (fpok1).
rules = koPOSITIONALscoreAREAtaxNONEsui0button0fpok1

logToStderr = false
logAllGTPCommunication = false
logSearchInfo = false

allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 3

# Visits per move. 500 is already far beyond professional strength with the
# b18 network; lower it for a quicker, gentler opponent.
maxVisits = 500
ponderingEnabled = false
numSearchThreads = 12

searchFactorAfterOnePass = 0.50
searchFactorAfterTwoPass = 0.25
