[writers]
"surround-ChannelGame" = ["surround-channel"]
"surround-ChannelUpdated" = ["surround-channel"]

[migration]
skip_contracts = ["surround-actions", "surround-Game", "surround-Board", "surround-PositionHistory", "surround-ScoreProposal", "surround-GameUpdated"]
