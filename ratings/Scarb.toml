[package]
name = "surround_ratings"
version = "0.1.0"
edition = "2024_07"
# Dojo-free, like rules/: a plain Starknet contract that outlives Dojo worlds.
# Built with Cairo 2.13.1 so the Dojo channel can import its interface.
cairo-version = "2.13.1"
description = "Surround's onchain ratings: arbiter_ratings with Go's rules (one pool, rank-dependent aging, kyu/dan ranks)."

[dependencies]
starknet = "2.13.1"
arbiter = { git = "https://github.com/broody/arbiter.git", rev = "ec78be7" }
arbiter_ratings = { git = "https://github.com/broody/arbiter.git", rev = "ec78be7" }

[dev-dependencies]
cairo_test = "2.13.1"
arbiter_testing = { git = "https://github.com/broody/arbiter.git", rev = "ec78be7" }
