[package]
name = "surround"
version = "0.1.0"
edition = "2024_07"
cairo-version = "=2.13.1"

[dependencies]
dojo = "=1.8.0"
starknet = "=2.13.1"
arbiter = { git = "https://github.com/broody/arbiter.git", rev = "efcd918" }
arbiter_dojo = { git = "https://github.com/broody/arbiter.git", rev = "efcd918" }
surround_rules = { path = "rules" }
surround_ratings = { path = "ratings" }
# The last OpenZeppelin releases for Cairo 2.13.
openzeppelin_interfaces = "=2.1.0"
openzeppelin_introspection = "=3.0.0"
openzeppelin_token = "=3.0.0"
openzeppelin_utils = "=2.1.0"

[dev-dependencies]
cairo_test = "=2.13.1"
dojo_cairo_test = "=1.8.0"
arbiter_testing = { git = "https://github.com/broody/arbiter.git", rev = "efcd918" }

[[target.starknet-contract]]
build-external-contracts = [
    "dojo::world::world_contract::world",
    "arbiter_dojo::models::m_ChannelTerms",
    "arbiter_dojo::models::m_ChannelState",
    "arbiter_dojo::models::m_ProverAllowed",
    "arbiter_dojo::models::e_ChannelUpdated",
    "surround_ratings::ratings::SurroundRatings",
]
casm = true

[tool.scarb]
allow-prebuilt-plugins = ["dojo_cairo_macros"]

[profile.sepolia]
